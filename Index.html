<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>帙雲 - 控制面板</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Serif TC', serif; background-color: #f4f6f7; text-align: center; }
        .links { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 50px;}
        .links a { padding: 20px; background: white; border-radius: 10px; text-decoration: none; color: #333; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 150px; cursor: pointer; transition: transform 0.2s;}
        .links a:hover { transform: translateY(-5px); }
        .links a.disabled { pointer-events: none; opacity: 0.6; }
        img { width: 48px; margin-bottom: 10px;}
        h1 { color: #2471a3; margin-top: 30px;}
        
        /* 讓操作區按鈕的顏色稍微不同以作區分 */
        .action-btn { background: #e8f8f5 !important; border: 1px solid #1abc9c;}
        /* 設定面板按鈕 */
        .config-btn { background: #eaf4fb !important; border: 1px solid #2e86c1;}

        /* Language toggle */
        .lang-btn {
          position: fixed; top: 12px; right: 16px;
          background: #2471a3; color: #fff;
          border: none; border-radius: 20px;
          padding: 6px 16px; font-size: 13px;
          cursor: pointer; z-index: 999;
          transition: background 0.2s;
        }
        .lang-btn:hover { background: #1a5a8a; }
    </style>
</head>
<body>
    <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
    <h1 id="title">☁️ 帙雲系統 - 控制面板</h1>
    
    <!-- 資料夾連結區 -->
    <div class="links">
        <a href="<?= urls.upload ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/paper-plane.png"><br><span data-i18n="upload">學生上傳區</span></a>
        <a href="<?= urls.pending ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/documents.png"><br><span data-i18n="pending">待批改課業</span></a>
        <a href="<?= urls.feedback ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/speech-bubble.png"><br><span data-i18n="feedback">老師回饋區</span></a>
        <a href="<?= urls.returned ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/checked.png"><br><span data-i18n="returned">已發還課業</span></a>
    </div>
    
    <!-- 系統功能區 -->
    <div class="links">
        <a href="<?= urls.appUrl ?>?page=record" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/book.png"><br><span data-i18n="record">繳交紀錄查閱</span></a>
        <a href="<?= urls.appUrl ?>?page=homework" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/gear.png"><br><span data-i18n="assign">布置課業</span></a>
        <a href="<?= urls.recordSheet ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/add-user-male.png"><br><span data-i18n="sheet">底層：繳交/佈置表</span></a>
        
        <!-- 手動發還按鈕 -->
        <a class="action-btn" id="manualReturnBtn" onclick="executeManualReturn()">
            <img id="returnIcon" src="https://img.icons8.com/ios-filled/50/1abc9c/send.png"><br>
            <span id="returnText" data-i18n="manualReturn">手動發還課業</span>
        </a>
    </div>

    <!-- 設定管理區 -->
    <div class="links">
        <a class="config-btn" href="<?= urls.appUrl ?>?page=config" target="_blank"><img src="https://img.icons8.com/ios-filled/50/2e86c1/settings.png"><br><span data-i18n="config">科目／類別設定</span></a>
        <a class="config-btn" href="<?= urls.appUrl ?>?page=autoshare" target="_blank"><img src="https://img.icons8.com/ios-filled/50/2e86c1/share.png"><br><span data-i18n="autoshare">自動共用管理</span></a>
        <a class="config-btn" href="<?= urls.autoShareSheet ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/2e86c1/google-sheets.png"><br><span data-i18n="shareSheet">共用位址表</span></a>
    </div>

    <!-- 腳本處理點擊事件 -->
    <script>
        // ── Language switcher ─────────────────────────────────────────────
        const I18N = {
          zh: {
            title: '☁️ 帙雲系統 - 控制面板',
            upload: '學生上傳區', pending: '待批改課業',
            feedback: '老師回饋區', returned: '已發還課業',
            record: '繳交紀錄查閱', assign: '布置課業',
            sheet: '底層：繳交/佈置表', manualReturn: '手動發還課業',
            config: '科目／類別設定', autoshare: '自動共用管理',
            shareSheet: '共用位址表',
            returning: '正在發還中...'
          },
          en: {
            title: '☁️ Zhiyun System - Dashboard',
            upload: 'Student Upload', pending: 'Pending Review',
            feedback: 'Teacher Feedback', returned: 'Returned Work',
            record: 'Submission Records', assign: 'Assign Homework',
            sheet: 'Spreadsheet', manualReturn: 'Manual Return',
            config: 'Subject / Category', autoshare: 'Auto-Share Mgmt',
            shareSheet: 'Share Address Sheet',
            returning: 'Returning...'
          }
        };
        let currentLang = localStorage.getItem('zhiyun_lang') || 'zh';

        function applyLang() {
          const t = I18N[currentLang];
          document.getElementById('title').textContent = t.title;
          document.querySelectorAll('[data-i18n]').forEach(function(el) {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
          });
          document.getElementById('lang-btn').textContent = currentLang === 'zh' ? 'EN' : '中文';
        }

        function toggleLang() {
          currentLang = currentLang === 'zh' ? 'en' : 'zh';
          localStorage.setItem('zhiyun_lang', currentLang);
          applyLang();
        }

        window.addEventListener('load', applyLang);

        // ── Manual return ─────────────────────────────────────────────────
        function executeManualReturn() {
            var btn = document.getElementById('manualReturnBtn');
            var icon = document.getElementById('returnIcon');
            var text = document.getElementById('returnText');
            var t = I18N[currentLang];

            btn.classList.add('disabled');
            icon.src = "https://img.icons8.com/ios-filled/50/1abc9c/hourglass.png";
            text.innerText = t.returning;

            google.script.run
                .withSuccessHandler(function(response) {
                    alert(response.message);
                    resetButton(btn, icon, text);
                })
                .withFailureHandler(function(error) {
                    alert("❌ " + error.message);
                    resetButton(btn, icon, text);
                })
                .triggerManualDistribute();
        }

        function resetButton(btn, icon, text) {
            btn.classList.remove('disabled');
            icon.src = "https://img.icons8.com/ios-filled/50/1abc9c/send.png";
            text.innerText = I18N[currentLang].manualReturn;
        }
    </script>
</body>
</html>
