<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>帙雲 - 控制面板</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Serif TC', serif; background-color: #f4f6f7; text-align: center; }
        .links { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 50px;}
        .links a { padding: 20px; background: white; border-radius: 10px; text-decoration: none; color: #333; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 150px; cursor: pointer; transition: transform 0.2s;}
        .links a:hover { transform: translateY(-5px); }
        .links a.disabled { pointer-events: none; opacity: 0.6; }
        img { width: 48px; margin-bottom: 10px;}
        h1 { color: #2471a3; margin-top: 30px;}
        
        /* 讓操作區按鈕的顏色稍微不同以作區分 */
        .action-btn { background: #e8f8f5 !important; border: 1px solid #1abc9c;}
        /* 設定面板按鈕 */
        .config-btn { background: #eaf4fb !important; border: 1px solid #2e86c1;}
    </style>
</head>
<body>
    <h1>☁️ 帙雲系統 - 控制面板</h1>
    
    <!-- 資料夾連結區 -->
    <div class="links">
        <a href="<?= urls.upload ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/paper-plane.png"><br>學生上傳區</a>
        <a href="<?= urls.pending ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/documents.png"><br>待批改課業</a>
        <a href="<?= urls.feedback ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/speech-bubble.png"><br>老師回饋區</a>
        <a href="<?= urls.returned ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/checked.png"><br>已發還課業</a>
    </div>
    
    <!-- 系統功能區 -->
    <div class="links">
        <a href="<?= urls.appUrl ?>?page=record" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/book.png"><br>繳交紀錄查閱</a>
        <a href="<?= urls.appUrl ?>?page=homework" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/gear.png"><br>布置課業</a>
        <a href="<?= urls.recordSheet ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/000000/add-user-male.png"><br>底層：繳交/佈置表</a>
        
        <!-- 手動發還按鈕 -->
        <a class="action-btn" id="manualReturnBtn" onclick="executeManualReturn()">
            <img id="returnIcon" src="https://img.icons8.com/ios-filled/50/1abc9c/send.png"><br>
            <span id="returnText">手動發還課業</span>
        </a>
    </div>

    <!-- 設定管理區 -->
    <div class="links">
        <a class="config-btn" href="<?= urls.appUrl ?>?page=config" target="_blank"><img src="https://img.icons8.com/ios-filled/50/2e86c1/settings.png"><br>科目／類別設定</a>
        <a class="config-btn" href="<?= urls.appUrl ?>?page=autoshare" target="_blank"><img src="https://img.icons8.com/ios-filled/50/2e86c1/share.png"><br>自動共用管理</a>
        <a class="config-btn" href="<?= urls.autoShareSheet ?>" target="_blank"><img src="https://img.icons8.com/ios-filled/50/2e86c1/google-sheets.png"><br>共用位址表</a>
    </div>

    <!-- 腳本處理點擊事件 -->
    <script>
        function executeManualReturn() {
            var btn = document.getElementById('manualReturnBtn');
            var icon = document.getElementById('returnIcon');
            var text = document.getElementById('returnText');

            // 改變按鈕狀態為處理中
            btn.classList.add('disabled');
            icon.src = "https://img.icons8.com/ios-filled/50/1abc9c/hourglass.png"; // 沙漏圖示
            text.innerText = "正在發還中...";

            // 呼叫後端發還程式
            google.script.run
                .withSuccessHandler(function(response) {
                    alert(response.message); // 顯示成功或錯誤訊息
                    resetButton(btn, icon, text);
                })
                .withFailureHandler(function(error) {
                    alert("❌ 系統無回應或連線錯誤：" + error.message);
                    resetButton(btn, icon, text);
                })
                .triggerManualDistribute();
        }

        // 恢復按鈕原本的狀態
        function resetButton(btn, icon, text) {
            btn.classList.remove('disabled');
            icon.src = "https://img.icons8.com/ios-filled/50/1abc9c/send.png";
            text.innerText = "手動發還課業";
        }
    </script>
</body>
</html>
